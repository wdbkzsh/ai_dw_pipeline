table:
  entity_id: wens_patrol_ticket
  name: 农户生产异常巡查工单
  physical_table: tk_wens_patrol_ticket
  databases:
  - rearer_breeding
  - next_rearer_fatten
  application: 育肥作业管理
  application_description: ''
  inheritance_path: 单据模板（bos_billtpl） -> 单据带组织模板（bos_billorgtpl） -> 农户生产异常巡查工单（wens_patrol_ticket）
fields:
- storage: fbillno
  identifier: billno
  name: 单据编号
  control_type: 单据编号
  required: true
- storage: fbillstatus
  identifier: billstatus
  name: 单据状态
  control_type: 单据状态
  required: true
  enum:
    A: 暂存
    B: 已提交
    C: 已审核
- storage: fcreatorid
  identifier: creator
  name: 创建人
  control_type: 人员
  reference: bos_user
- storage: fmodifierid
  identifier: modifier
  name: 修改人
  control_type: 人员
  reference: bos_user
- storage: fauditorid
  identifier: auditor
  name: 审核人
  control_type: 人员
  reference: bos_user
- storage: fauditdate
  identifier: auditdate
  name: 审核日期
  control_type: 长日期
- storage: fmodifytime
  identifier: modifytime
  name: 修改时间
  control_type: 日期
- storage: fcreatetime
  identifier: createtime
  name: 创建时间
  control_type: 日期
- storage: forgid
  identifier: org
  name: 组织
  control_type: 组织
  reference: bos_org
- storage: fk_wens_basedatafield
  identifier: wens_rearer_farm_pig
  name: 养户
  control_type: 基础资料
  reference: wens_rearer_farm_pig
- storage: fk_wens_recbrlrflk_pig
