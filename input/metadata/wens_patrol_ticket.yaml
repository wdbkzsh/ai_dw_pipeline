  name: 猪群编码
  control_type: 基础资料
  reference: wens_recbrlrflk_pig
- storage: fk_wens_alert_metric
  identifier: wens_alert_metric
  name: 预警指标
  control_type: 下拉列表
  enum:
    '1': 两周死淘率
    '2': 五周死淘率
    '3': 单日死淘率
    '4': 连续2天死淘率
    '5': 连续3天采食量
    '6': 连续4天死
    '7': 单日采食量
    '8': 连续2天采食量
    '9': 连续3天采食量
- storage: fk_wens_alarm_level
  identifier: wens_alarm_level
  name: 预警等级
  control_type: 下拉列表
  enum:
    '1': 一级告警
    '2': 二级告警
    '3': 三级告警
    '4': 四级告警
- storage: fk_wens_alarm_value
  identifier: wens_alarm_value
  name: 触发预警时数值
  control_type: 文本
- storage: fk_wens_alarm_time
  identifier: wens_alarm_time
  name: 预警时间
  control_type: 长日期
- storage: fk_wens_status
  identifier: wens_status
  name: 预警状态
  control_type: 下拉列表
  enum:
    '1': 持续中
    '2': 已关闭
    '3': 仅通知
- storage: fk_wens_creator
  identifier: wens_creator
  name: 创建人
  control_type: 人员
  reference: bos_user
- storage: fk_wens_auditor
  identifier: wens_auditor
  name: 审核人
  control_type: 人员
  reference: bos_user
- storage: fk_wens_executor
  identifier: wens_executor
  name: 执行人
  control_type: 人员
  reference: bos_user
- storage: fk_wens_atrol_ticket_stat
  identifier: wens_atrol_ticket_status
  name: 巡查工单状态
  control_type: 下拉列表
  enum:
    '1': 未完成
    '2': 已完成
    '3': 未完成(过期)
- storage: fk_wens_warning_billno
  identifier: wens_warning_billno
  name: 预警单据编号
  control_type: 文本
entries:
- storage: tk_wens_risk_item_entry
  identifier: wens_risk_item_entry
  name: 单据体
  control_type: 分录
  fields:
  - storage: fk_wens_risk_item
    identifier: wens_risk_item
    name: 自定义风险大类
    control_type: 文本
    required: true
  - storage: fk_wens_custom_risk_iteme
