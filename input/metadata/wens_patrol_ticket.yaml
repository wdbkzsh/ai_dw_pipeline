    identifier: wens_handle_strategy
    name: 应对策略
    control_type: 基础资料
    reference: wens_handle_strategy
  - storage: ''
    identifier: wens_patrol_risk_category
    name: 风险大类
    control_type: 基础资料属性
    notes:
    - 取自【应对策略】
  - storage: ''
    identifier: wens_risk_project
    name: 风险项
    control_type: 基础资料属性
    notes:
    - 取自【应对策略】
  - storage: ''
    identifier: wens_wens_strategy
    name: 对应措施
    control_type: 基础资料属性
    notes:
    - 取自【应对策略】
  - storage: fk_wens_is_execute
    identifier: wens_is_execute
    name: 是否执行
    control_type: 下拉列表
    enum:
      '1': 是
      '2': 否
  - storage: fk_wens_is_adopt
    identifier: wens_is_adopt
    name: 是否采纳
    control_type: 下拉列表
    enum:
      '1': 是
      '2': 否
