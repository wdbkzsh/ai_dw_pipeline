# 问题确认结果
business_questions:
  - question_id: Q001
    related_metric:
      - M006
      - C001
    question: 总养户数是统计所有养户，还是只统计"在养"状态的养户？
    impact: 影响"生产异常农户占比"的计算
    status: confirmed
    answer: 统计所有使用状态为"可用"的养户（fenable = '1'）并且饲养状态为"在养"的养户（fk_wens_status = '1'）并且单据状态为已审核（fstatus='C'）

  - question_id: Q002
    related_metric:
      - M012
      - C004
    question: 7天复发率的判断条件中，"预警状态一致"是否需要排除"已关闭"状态？
    impact: 影响复发率的计算准确性
    status: confirmed
    answer: 不需要排除，包含所有状态，只要7天内有相同条件的预警即为复发

  - question_id: Q003
    related_metric:
      - M005
    question: "今日仅通知"是指预警时间在今天，还是预警状态变更为"仅通知"的时间在今天？
    impact: 影响指标的统计口径
    status: confirmed
    answer: 当前时间下预警状态为"仅通知"的养户数（不按时间筛选，按当前状态筛选）

  - question_id: Q004
    related_metric:
      - T001
      - T002
    question: 预警类型趋势和预警等级趋势的时间粒度是按天、按周还是按月？
    impact: 影响趋势图的展示效果
    status: confirmed
    answer: 按月粒度统计

  - question_id: Q005
    related_metric:
      - C003
    question: 有效干涉率是按巡查工单数量计算，还是按预警记录数量计算？
    impact: 影响指标的计算逻辑
    status: confirmed
    answer: 按照预警记录数量计算

  - question_id: Q006
    related_metric:
      - C005
    question: 风险大类占比的分母是预警总数还是巡查工单分录总数？
    impact: 影响占比计算
    status: confirmed
    answer: 按照预警总数计算

# 确认状态
confirmation:
  status: confirmed
  confirmed_by: 业务方
  confirmed_time: 2026-09-03
