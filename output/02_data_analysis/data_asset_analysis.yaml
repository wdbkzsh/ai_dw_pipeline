# Data Asset Analysis
# Version: 1.0
# Generated: 2026-09-07

# 项目信息
project:
  project_id: wens_dw_project
  project_name: 农户生产异常预警分析看板

# 业务对象与源数据资产映射
business_object_assets:

  # 养户
  - business_object:
      entity_id: E001
      entity_name: 养户
      description: 参与养殖合作的农户，是生产管理的基本单位

    candidate_source_tables:
      - table_name: wens_rearer_farm_pig
        physical_table: tk_wens_rea_farm_info
        business_role: 主数据表
        description: 养猪养户档案，存储养户基本信息
        key_fields:
          - field_name: fmasterid
            description: 主数据内码（主键）
            usage: 养户唯一标识
          - field_name: fnumber
            description: 编码
            usage: 养户业务编码
          - field_name: fname
            description: 养户档案名称
            usage: 养户名称
          - field_name: fenable
            description: 使用状态
            usage: 判断养户是否可用（0=禁用, 1=可用）
          - field_name: fk_wens_status
            description: 饲养状态
            usage: 判断养户是否在养（1=在养, 2=空栏中, 3=已停养, 4=销户）
          - field_name: fstatus
            description: 数据状态
            usage: 判断数据是否已审核（A=暂存, B=已提交, C=已审核）
          - field_name: fk_wens_rearer
            description: 开户人姓名
            usage: 养户关联的人员信息
          - field_name: fk_wens_farm
            description: 养殖场名称
            usage: 养户关联的养殖场
          - field_name: fk_wens_manager
            description: 管理员
            usage: 养户的管理人员
          - field_name: forgid
            description: 组织
            usage: 养户所属组织
        missing_fields: []

  # 猪群
  - business_object:
      entity_id: E002
      entity_name: 猪群
      description: 养户管理下的一个批次猪群，是生产核算的基本单位

    candidate_source_tables:
      - table_name: wens_recbrlrflk_pig
        physical_table: tk_wens_recbrlrflk
        business_role: 主数据表
        description: 养猪畜禽档案，存储猪群基本信息
        key_fields:
          - field_name: fmasterid
            description: 主数据内码（主键）
            usage: 猪群唯一标识
          - field_name: fnumber
            description: 编码
            usage: 猪群业务编码
          - field_name: fname
            description: 名称
            usage: 猪群名称
          - field_name: fk_wens_recrearer
            description: 养户档案名称
            usage: 猪群关联的养户
          - field_name: fk_wens_material
            description: 饲养品种
            usage: 猪群的品种信息
          - field_name: fk_wens_flkstatus
            description: 猪群状态
            usage: 判断猪群状态（0=申请领苗, 1=在养, 2=已上市, 3=已结算）
          - field_name: fk_wens_seedtime
            description: 首次进苗日期
            usage: 猪群的进苗时间
          - field_name: fk_wens_stockqty
            description: 存栏量
            usage: 猪群当前存栏数量
          - field_name: fk_wens_deadqty
            description: 总死淘数
            usage: 猪群累计死淘数量
          - field_name: fk_wens_chickqty
            description: 苗总数量
            usage: 猪群进苗总数
          - field_name: fk_wens_useorg
            description: 业务组织
            usage: 猪群所属组织
        missing_fields: []

  # 生产异常预警
  - business_object:
      entity_id: E003
      entity_name: 生产异常预警
      description: 系统根据预设规则自动触发的生产异常告警

    candidate_source_tables:
      - table_name: wens_production_anomaly
        physical_table: tk_wens_production_anomal
        business_role: 业务单据表
        description: 农户生产异常预警，存储预警记录
        key_fields:
          - field_name: fbillno
            description: 单据编号
            usage: 预警记录唯一标识
          - field_name: forgid
            description: 组织
            usage: 预警所属组织
          - field_name: fk_wens_basedatafield
            description: 养户
            usage: 预警关联的养户
          - field_name: fk_wens_recbrlrflk_pig
            description: 猪群编码
            usage: 预警关联的猪群
          - field_name: fk_wens_alert_metric
            description: 预警指标
            usage: 触发预警的指标类型（1=两周死淘率, 2=五周死淘率, ...）
          - field_name: fk_wens_alarm_level
            description: 预警等级
            usage: 预警的严重程度（1=一级告警, 2=二级告警, 3=三级告警, 4=四级告警）
          - field_name: fk_wens_alarm_value
            description: 触发预警时数值
            usage: 触发预警的具体数值
          - field_name: fk_wens_alarm_time
            description: 预警时间
            usage: 预警触发的时间
          - field_name: fk_wens_status
            description: 预警状态
            usage: 预警当前状态（1=持续中, 2=已关闭, 3=仅通知）
          - field_name: fk_wens_closing_time
            description: 预警关闭时间
            usage: 预警关闭的时间
          - field_name: fk_wens_duration
            description: 持续时长
            usage: 预警持续的天数
          - field_name: fk_wens_is_generate_ticke
            description: 是否巡查
            usage: 是否需要巡查处理
          - field_name: fk_wens_patrol_operator
            description: 巡查处理人
            usage: 负责巡查的人员
        missing_fields: []

  # 巡查工单
  - business_object:
      entity_id: E004
      entity_name: 巡查工单
      description: 针对生产异常预警创建的处理工单

    candidate_source_tables:
      - table_name: wens_patrol_ticket
        physical_table: tk_wens_patrol_ticket
        business_role: 业务单据表
        description: 农户生产异常巡查工单，存储巡查记录
        key_fields:
          - field_name: fbillno
            description: 单据编号
            usage: 巡查工单唯一标识
          - field_name: forgid
            description: 组织
            usage: 巡查工单所属组织
          - field_name: fk_wens_basedatafield
            description: 养户
            usage: 巡查工单关联的养户
          - field_name: fk_wens_recbrlrflk_pig
            description: 猪群编码
            usage: 巡查工单关联的猪群
          - field_name: fk_wens_alert_metric
            description: 预警指标
            usage: 关联的预警指标
          - field_name: fk_wens_alarm_level
            description: 预警等级
            usage: 关联的预警等级
          - field_name: fk_wens_alarm_time
            description: 预警时间
            usage: 关联的预警时间
          - field_name: fk_wens_status
            description: 预警状态
            usage: 关联的预警状态
          - field_name: fk_wens_creator
            description: 创建人
            usage: 工单创建人
          - field_name: fk_wens_auditor
            description: 审核人
            usage: 工单审核人
          - field_name: fk_wens_executor
            description: 执行人
            usage: 工单执行人
          - field_name: fk_wens_atrol_ticket_stat
            description: 巡查工单状态
            usage: 工单当前状态（1=未完成, 2=已完成, 3=未完成(过期)）
          - field_name: fk_wens_warning_billno
            description: 预警单据编号
            usage: 关联的预警单据编号
        entries:
          - entry_name: tk_wens_risk_item_entry
            description: 风险项分录
            key_fields:
              - field_name: fk_wens_risk_item
                description: 自定义风险大类
                usage: 风险分类
              - field_name: fk_wens_custom_risk_iteme
                description: 自定义风险项
                usage: 具体风险项
              - field_name: fk_wens_custom_policy
                description: 自定义策略
                usage: 应对策略
              - field_name: fk_wens_custom_is_execute
                description: 是否执行
                usage: 策略执行状态
              - field_name: fk_wens_custom_is_adopt
                description: 是否采纳
                usage: 策略采纳状态
          - entry_name: tk_cause_analysis
            description: 原因分析分录
            key_fields:
              - field_name: fk_wens_handle_strategy
                description: 应对策略
                usage: 关联的应对策略
              - field_name: fk_wens_is_execute
                description: 是否执行
                usage: 策略执行状态
              - field_name: fk_wens_is_adopt
                description: 是否采纳
                usage: 策略采纳状态
        missing_fields: []

  # 应对策略
  - business_object:
      entity_id: E005
      entity_name: 应对策略
      description: 针对异常原因制定的处理措施

    candidate_source_tables:
      - table_name: wens_handle_strategy
        physical_table: tk_wens_handle_strategy
        business_role: 基础资料表
        description: 原因分析及应对策略，存储策略配置
        key_fields:
          - field_name: fnumber
            description: 单据编码
            usage: 策略唯一标识
          - field_name: fname
            description: 名称
            usage: 策略名称
          - field_name: fk_wens_org
            description: 组织
            usage: 策略所属组织
          - field_name: fk_wens_patrol_risk_type
            description: 风险大类
            usage: 策略关联的风险大类
          - field_name: fk_wens_risk_project
            description: 风险项
            usage: 策略关联的风险项
          - field_name: fk_wens_tactic
            description: 对应策略
            usage: 具体的应对策略
        missing_fields: []

# 数据资产汇总
summary:
  total_tables: 5
  total_fields: 85
  business_objects_covered: 5
  coverage_status: 完全覆盖
