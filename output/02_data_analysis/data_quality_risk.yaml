# Data Quality Risk Analysis
# Version: 1.0
# Generated: 2026-09-07

# 项目信息
project:
  project_id: wens_dw_project
  project_name: 农户生产异常预警分析看板

# 数据质量风险
data_quality_risks:

  # 粒度问题
  grain_risks:
    - risk_id: GR001
      risk_name: 预警记录粒度不明确
      description: 一条预警记录是对应一个养户的一个猪群的一个预警事件，还是一个养户的所有预警事件？
      affected_tables:
        - wens_production_anomaly
      affected_metrics:
        - M001
        - M002
        - M003
        - M004
        - M005
      impact: 可能导致指标统计重复或遗漏
      likelihood: medium
      mitigation: 需要确认预警记录的业务粒度
      status: 待确认

    - risk_id: GR002
      risk_name: 巡查工单与预警记录的对应关系
      description: 一条预警记录可以对应多条巡查工单，但业务上是否允许多次巡查？
      affected_tables:
        - wens_patrol_ticket
        - wens_production_anomaly
      affected_metrics:
        - C003
      impact: 可能导致有效干涉率计算不准确
      likelihood: medium
      mitigation: 需要确认业务规则
      status: 待确认

  # 字段缺失
  field_missing_risks:
    - risk_id: FM001
      risk_name: 预警内容字段缺失
      description: wens_production_anomaly 表的 fk_wens_alert_content_t 字段可能存储预警的具体内容，但数据字典中未明确其格式和取值范围
      affected_tables:
        - wens_production_anomaly
      affected_metrics: []
      impact: 无法进行预警内容分析
      likelihood: low
      mitigation: 需要确认字段的实际存储内容
      status: 待确认

    - risk_id: FM002
      risk_name: 预警关闭原因字段缺失
      description: wens_production_anomaly 表的 fk_wens_largetextfield 字段存储预警关闭原因，但可能为空
      affected_tables:
        - wens_production_anomaly
      affected_metrics: []
      impact: 无法进行关闭原因分析
      likelihood: medium
      mitigation: 需要确认字段的填充率
      status: 待确认

  # 状态问题
  status_risks:
    - risk_id: SR001
      risk_name: 预警状态枚举值不一致
      description: 预警状态的枚举值定义为 '1'=持续中, '2'=已关闭, '3'=仅通知，但实际存储值可能不同
      affected_tables:
        - wens_production_anomaly
      affected_metrics:
        - M001
        - M002
        - M003
        - M004
        - M005
        - M007
      impact: 过滤条件可能失效
      likelihood: low
      mitigation: 需要验证实际数据中的枚举值
      status: 待确认

    - risk_id: SR002
      risk_name: 巡查工单状态枚举值不一致
      description: 巡查工单状态的枚举值定义为 '1'=未完成, '2'=已完成, '3'=未完成(过期)，但实际存储值可能不同
      affected_tables:
        - wens_patrol_ticket
      affected_metrics:
        - M010
      impact: 过滤条件可能失效
      likelihood: low
      mitigation: 需要验证实际数据中的枚举值
      status: 待确认

    - risk_id: SR003
      risk_name: 复选框字段存储值不一致
      description: fk_wens_is_generate_ticke 和 fk_wens_custom_is_adopt 是复选框字段，存储值可能是 '是'/'否' 或 '1'/'0'
      affected_tables:
        - wens_production_anomaly
        - wens_patrol_ticket
      affected_metrics:
        - M003
        - M004
        - M014
      impact: 过滤条件可能失效
      likelihood: medium
      mitigation: 需要验证实际数据中的存储值
      status: 待确认

  # 时间问题
  time_risks:
    - risk_id: TR001
      risk_name: 时间字段格式不一致
      description: 不同表的时间字段可能使用不同的格式（如 datetime、timestamp、date）
      affected_tables:
        - wens_production_anomaly
        - wens_patrol_ticket
      affected_metrics:
        - M012
        - T001
        - T002
        - T003
        - T004
        - T005
      impact: 时间计算可能出错
      likelihood: medium
      mitigation: 需要统一时间格式
      status: 待确认

    - risk_id: TR002
      risk_name: 时区问题
      description: 时间字段可能涉及时区转换问题
      affected_tables:
        - wens_production_anomaly
        - wens_patrol_ticket
      affected_metrics:
        - M005
        - T001
        - T002
        - T003
        - T004
        - T005
      impact: 时间计算可能不准确
      likelihood: low
      mitigation: 需要确认时区设置
      status: 待确认

    - risk_id: TR003
      risk_name: 持续时长字段单位不明确
      description: fk_wens_duration 字段的单位是天、小时还是分钟？
      affected_tables:
        - wens_production_anomaly
      affected_metrics:
        - M009
        - T003
      impact: 平均持续时长计算可能不准确
      likelihood: medium
      mitigation: 需要确认字段的单位
      status: 待确认

  # 关系问题
  relationship_risks:
    - risk_id: RR001
      risk_name: 预警记录与养户的关联可能不完整
      description: 部分预警记录可能没有关联到养户
      affected_tables:
        - wens_production_anomaly
        - wens_rearer_farm_pig
      affected_metrics:
        - M001
        - M002
        - M003
        - M004
        - M005
      impact: 指标统计可能遗漏
      likelihood: low
      mitigation: 需要验证关联完整性
      status: 待确认

    - risk_id: RR002
      risk_name: 巡查工单与预警记录的关联可能不完整
      description: 部分巡查工单可能没有关联到预警记录
      affected_tables:
        - wens_patrol_ticket
        - wens_production_anomaly
      affected_metrics:
        - C003
      impact: 有效干涉率计算可能不准确
      likelihood: low
      mitigation: 需要验证关联完整性
      status: 待确认

  # 数据完整性问题
  completeness_risks:
    - risk_id: CR001
      risk_name: 养户档案可能不完整
      description: 部分养户可能没有在 wens_rearer_farm_pig 表中维护
      affected_tables:
        - wens_rearer_farm_pig
      affected_metrics:
        - M006
      impact: 总养户数统计可能不准确
      likelihood: low
      mitigation: 需要验证数据完整性
      status: 待确认

    - risk_id: CR002
      risk_name: 猪群档案可能不完整
      description: 部分猪群可能没有在 wens_recbrlrflk_pig 表中维护
      affected_tables:
        - wens_recbrlrflk_pig
      affected_metrics: []
      impact: 猪群相关分析可能不完整
      likelihood: low
      mitigation: 需要验证数据完整性
      status: 待确认

# 风险汇总
summary:
  total_risks: 15
  high_risk: 0
  medium_risk: 7
  low_risk: 8
  key_risks:
    - GR001: 预警记录粒度不明确
    - SR003: 复选框字段存储值不一致
    - TR001: 时间字段格式不一致
    - TR003: 持续时长字段单位不明确
  mitigation_priority:
    - 首先确认枚举值和存储值的实际取值
    - 其次确认时间字段的格式和单位
    - 最后验证数据完整性和关联完整性

# 建议的验证步骤
recommended_validation_steps:

  - step_no: 1
    step_name: 验证枚举值
    description: 查询实际数据中的枚举值，确认与数据字典一致
    validation_sql: |
      -- 验证预警状态枚举值
      SELECT DISTINCT fk_wens_status, COUNT(*)
      FROM tk_wens_production_anomal
      GROUP BY fk_wens_status

      -- 验证巡查工单状态枚举值
      SELECT DISTINCT fk_wens_atrol_ticket_stat, COUNT(*)
      FROM tk_wens_patrol_ticket
      GROUP BY fk_wens_atrol_ticket_stat

  - step_no: 2
    step_name: 验证复选框字段
    description: 查询复选框字段的实际存储值
    validation_sql: |
      -- 验证是否巡查字段
      SELECT DISTINCT fk_wens_is_generate_ticke, COUNT(*)
      FROM tk_wens_production_anomal
      GROUP BY fk_wens_is_generate_ticke

      -- 验证是否采纳字段
      SELECT DISTINCT fk_wens_custom_is_adopt, COUNT(*)
      FROM tk_wens_risk_item_entry
      GROUP BY fk_wens_custom_is_adopt

  - step_no: 3
    step_name: 验证时间字段
    description: 查询时间字段的格式和取值范围
    validation_sql: |
      -- 验证预警时间字段
      SELECT
        MIN(fk_wens_alarm_time) as min_time,
        MAX(fk_wens_alarm_time) as max_time,
        COUNT(*) as total_count,
        COUNT(fk_wens_alarm_time) as non_null_count
      FROM tk_wens_production_anomal

      -- 验证持续时长字段
      SELECT
        MIN(fk_wens_duration) as min_duration,
        MAX(fk_wens_duration) as max_duration,
        AVG(fk_wens_duration) as avg_duration,
        COUNT(*) as total_count,
        COUNT(fk_wens_duration) as non_null_count
      FROM tk_wens_production_anomal

  - step_no: 4
    step_name: 验证关联完整性
    description: 查询表之间的关联完整性
    validation_sql: |
      -- 验证预警记录与养户的关联完整性
      SELECT
        COUNT(*) as total_alerts,
        COUNT(fk_wens_basedatafield) as has_farmer,
        COUNT(*) - COUNT(fk_wens_basedatafield) as missing_farmer
      FROM tk_wens_production_anomal
      WHERE fbillstatus = 'C'

      -- 验证巡查工单与预警记录的关联完整性
      SELECT
        COUNT(*) as total_tickets,
        COUNT(fk_wens_warning_billno) as has_alert,
        COUNT(*) - COUNT(fk_wens_warning_billno) as missing_alert
      FROM tk_wens_patrol_ticket
      WHERE fbillstatus = 'C'
