  # T005 - 有效干涉率趋势
  - metric_id: T005
    metric_name: 有效干涉率趋势
    time_dimension: 月份
    analysis_dimension: []
    measure_metric: 有效干涉率
    pseudocode: |
      SELECT
        DATE_FORMAT(pt.fcreatetime, '%Y-%m') as month,
        COUNT(DISTINCT CASE WHEN pt.fk_wens_atrol_ticket_stat = '2' THEN pt.fk_wens_warning_billno END) * 1.0
        / COUNT(DISTINCT pa.fbillno) as interference_rate
      FROM tk_wens_production_anomal pa
      LEFT JOIN tk_wens_patrol_ticket pt ON pa.fbillno = pt.fk_wens_warning_billno
      WHERE pa.fbillstatus = 'C'
      GROUP BY DATE_FORMAT(pt.fcreatetime, '%Y-%m')

